      :root {
        --color-primary: #dffb51;
        --color-bg: #101210;
        --color-surface: #1b1f1b;
        --color-text: #f5f5ee;
        --color-muted: #9ba39b;

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 90% 4%, rgba(135, 231, 209, .13), transparent 28rem), var(--color-bg);

      header, main, footer { width: min(100%, 780px); margin: auto; }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 28px 20px 25px;
        border-bottom: 1px solid var(--line);
      }

      .mark { color: var(--color-primary); font-size: 35px; line-height: 1; }

      .eyebrow {
        font-family: DM Mono, monospace;
        letter-spacing: .08em;

      main { padding: 40px 20px 52px; }
      .intro { color: var(--color-muted); line-height: 1.75; margin: 0 0 32px; font-size: 14px; }

      .tool {
        display: block;
        text-decoration: none;
        color: inherit;
        background: var(--color-surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, .22);
        transition: border-color .15s, transform .15s;
      }

      .tool:hover { border-color: var(--color-primary); transform: translateY(-2px); }
      .tool h2 { margin: 0 0 8px; font-size: 20px; letter-spacing: -.03em; color: var(--color-primary); }
      .tool p { margin: 0; color: var(--color-muted); font-size: 13px; line-height: 1.7; }

      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
      .chips span {
        padding: 5px 8px;
        border-radius: 99px;
        border: 1px solid var(--line);
        color: #c9d0c9;
        font-family: DM Mono, monospace;
        font-size: 11px;
      }

      footer {
        border-top: 1px solid var(--line);
        padding: 20px;
        color: #697169;
        font-family: DM Mono, monospace;
        font-size: 10px;
        text-align: center;
      }

      footer p { margin: 0; }
      footer p + p { margin-top: 7px; }

      footer a {
        color: var(--color-accent);
        text-decoration: none;
        border-bottom: 1px solid rgba(135, 231, 209, .35);
      }

      footer a:hover { color: var(--color-primary); border-bottom-color: var(--color-primary); }

      @media (min-width: 640px) {
        header { padding-inline: 32px; }
        main { padding: 52px 32px 64px; }
