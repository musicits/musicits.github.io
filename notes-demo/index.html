<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="노트">
<title>게스트판 · 뮤직잇츠 노트</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="app" data-pane="list">
  <aside class="side" id="side">
    <div class="side-head">
      <button class="brand" id="bBrand" title="앱으로 설치"><img class="brand-logo" src="logo-dark.png" alt="music ITs"><span class="brand-nm">NOTES</span><small id="who" class="who"></small></button>
      <button class="btn primary" id="bNew" hidden>새 노트</button>
      <button class="sicon" id="bSync" title="동기화·백업" aria-label="동기화·백업"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18.5h10.5a4 4 0 00.6-7.95A5.5 5.5 0 007.4 9.2 4.7 4.7 0 007 18.5z"/></svg></button>
      <button class="sicon" id="bPrefs" title="환경설정" aria-label="환경설정"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg></button>
    </div>
    <div class="side-scroll">
      <div class="cal" id="cal"></div>
      <div id="nav"></div>
    </div>
    <div class="side-foot" hidden>
      <button class="btn" id="bGraph">그래프</button>
      <button class="btn" id="bImport">가져오기</button>
      <button class="btn" id="bSettings">설정</button>
      <button class="btn" id="bHelp">도움말</button>
    </div>
  </aside>

  <section class="list" id="list">
    <div class="list-head">
      <button class="gbtn phone-only" data-pane-go="side" aria-label="모아보기"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4.5 7h15M4.5 12h11M4.5 17h15"/></svg></button>
      <button class="btn tablet-side" id="bSideT">모아보기</button>
      <button class="list-title" id="listTitle">모든 노트</button>
      <span class="ct" id="listCount"></span>
      <button class="cbtn" id="listNew" title="새 노트 (⌥N)" aria-label="새 노트"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 5.5H7a2.5 2.5 0 00-2.5 2.5v9A2.5 2.5 0 007 19.5h9a2.5 2.5 0 002.5-2.5v-5.5"/><path d="M17.3 4.2a1.7 1.7 0 012.5 2.5L12.5 14l-3.2.7.7-3.2z"/></svg></button>
      <button class="cbtn" id="listFind" title="찾기 (⌘F)" aria-label="찾기"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></button>
    </div>
    <div class="list-tools" id="listTools"></div>
    <div class="searchrow" id="searchRow">
      <input class="search" id="q" type="search" placeholder="찾기" autocomplete="off" spellcheck="false">
      <select class="sortsel" id="sort" title="정렬">
        <option value="mtime">고친 순</option>
        <option value="ctime">만든 순</option>
        <option value="title">이름 순</option>
      </select>
    </div>
    <div class="items" id="items"></div>
    <button class="fab phone-only" id="fabNew" aria-label="새 노트"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 5.5H7a2.5 2.5 0 00-2.5 2.5v9A2.5 2.5 0 007 19.5h9a2.5 2.5 0 002.5-2.5v-5.5"/><path d="M17.3 4.2a1.7 1.7 0 012.5 2.5L12.5 14l-3.2.7.7-3.2z"/></svg></button>
  </section>

  <main class="main" id="main">
    <div class="ed-top">
      <button class="gbtn phone-only" data-pane-go="list" aria-label="목록"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
      <button class="ibtn desk-only" id="tLayoutI" title="보기 방식" aria-label="보기 방식"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M9 5v14"/><path d="M5.6 8.5h1.4M5.6 11h1.4"/></svg></button>
      <div class="crumb" id="crumb"></div>
      <span class="status" id="status"></span>
      <div class="tools" id="tools">
        <button class="btn sm legacy" id="tAI" hidden>AI 요약</button>
        <button class="btn sm legacy" id="tPin">고정</button>
        <button class="btn sm legacy" id="tArchive">보관</button>
        <button class="btn sm legacy" id="tMove">옮기기</button>
        <button class="btn sm legacy" id="tExport">내보내기</button>
        <button class="btn sm legacy" id="tTrash">휴지통</button>
        <button class="btn sm desk-only legacy" id="tFocus">집중<kbd data-k="mod+\"></kbd></button>
        <button class="btn sm legacy" id="tPanel">정보</button>
        <button class="btn sm legacy" id="tRead">읽기<kbd data-k="mod+E"></kbd></button>
        <div class="ibar">
          <button class="ibtn aib" id="tAiI" title="Claude" aria-label="Claude" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span>Claude</span></button>
          <button class="ibtn" id="tLockI" title="읽기 전용 풀기" aria-label="읽기 전용 풀기" hidden><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 017 0v2.5"/></svg></button>
          <button class="ibtn biu" id="tFmtI" title="스타일 막대 보이기·숨기기" aria-label="스타일 막대"><b>B</b><i>I</i><u>U</u></button>
          <button class="ibtn" id="tReadI" title="읽기 ↔ 편집 (⌘E)" aria-label="읽기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5c2.6-1 5.4-1 8.5.8 3.1-1.8 5.9-1.8 8.5-.8v13c-2.6-1-5.4-1-8.5.8-3.1-1.8-5.9-1.8-8.5-.8z"/><path d="M12 6.3v13"/></svg></button>
          <button class="ibtn" id="tPanelI" title="정보" aria-label="정보"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".6" fill="currentColor"/></svg></button>
          <button class="ibtn" id="tMore" title="더 보기" aria-label="더 보기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="18.5" r="1" fill="currentColor"/></svg></button>
        </div>
      </div>
    </div>
    <div class="fmt" id="fmt" role="toolbar" aria-label="서식">
      <div class="fg">
        <button data-menu="mH" title="제목" aria-label="제목"><b class="hh">H</b><svg class="car" viewBox="0 0 10 10" width="9" height="9" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="fmenu" id="mH" hidden>
          <button data-c="h0">본문</button>
          <button data-c="h1" title="⌘1"><span class="m1">제목 1</span></button>
          <button data-c="h2" title="⌘2"><span class="m2">제목 2</span></button>
          <button data-c="h3" title="⌘3"><span class="m3">제목 3</span></button>
          <button data-c="h4" title="⌘4">제목 4</button>
        </div>
      </div>
      <button data-c="task" title="할 일 (⌘Enter)" aria-label="할 일"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M8.5 12.2l2.4 2.4 4.8-5"/></svg></button>
      <div class="fg">
        <button data-menu="mL" title="목록" aria-label="목록"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.6" cy="6.5" r=".9" fill="currentColor"/><circle cx="4.6" cy="12" r=".9" fill="currentColor"/><circle cx="4.6" cy="17.5" r=".9" fill="currentColor"/></svg><svg class="car" viewBox="0 0 10 10" width="9" height="9" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="fmenu" id="mL" hidden>
          <button data-c="bullet">• 목록</button>
          <button data-c="numbered">1. 번호 목록</button>
          <button data-c="quote">❝ 인용</button>
          <button data-c="indent" title="Tab">→ 들여쓰기</button>
          <button data-c="outdent" title="⇧Tab">← 내어쓰기</button>
        </div>
      </div>
      <span class="sep"></span>
      <button data-c="bold" title="굵게 (⌘B)" aria-label="굵게"><b class="tx">B</b></button>
      <button data-c="italic" title="기울임 (⌘I)" aria-label="기울임"><i class="tx">I</i></button>
      <div class="fg">
        <button data-menu="mM" title="형광펜·밑줄·취소선" aria-label="형광펜"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4.5l5 5-8.5 8.5H6v-5z"/><path d="M4 21h8" stroke="var(--accent)" stroke-width="2.4"/></svg><svg class="car" viewBox="0 0 10 10" width="9" height="9" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="fmenu" id="mM" hidden>
          <button data-c="highlight" title="⌘⇧H"><span class="mk">형광펜</span></button>
          <button data-c="underline" title="⌘U"><u>밑줄</u></button>
          <button data-c="strike" title="⌘⇧X"><s>취소선</s></button>
          <button data-c="code" title="⌘`"><code>코드</code></button>
        </div>
      </div>
      <span class="sep"></span>
      <button data-c="link" title="링크 (⌘K)" aria-label="링크"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4.5 4.5 0 006.4 0l3-3a4.5 4.5 0 00-6.4-6.4l-1.2 1.2"/><path d="M14 10a4.5 4.5 0 00-6.4 0l-3 3a4.5 4.5 0 006.4 6.4l1.2-1.2"/></svg></button>
      <button data-c="table" class="desk-only" title="표" aria-label="표"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10"/></svg></button>
      <button data-c="image" title="사진" aria-label="사진"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 15.5l-4.5-4.5-7.5 8"/></svg></button>
      <button data-c="kbd" class="phone-only kbd" title="자판 내리기" aria-label="자판 내리기"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="11" rx="2.2"/><path d="M6.5 8h.5M9.5 8h.5M12.5 8h.5M15.5 8h.5M6.5 11h.5M17 11h.5M9.5 11.5h5M9.5 19l2.5 2 2.5-2"/></svg></button>
      <div class="fg">
        <button data-menu="mMore" title="더 보기" aria-label="더 보기"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="18.5" r="1" fill="currentColor"/></svg></button>
        <div class="fmenu right" id="mMore" hidden>
          <button data-c="wikilink">[[ ]] 노트 잇기</button>
          <button data-c="codeblock">코드 블록</button>
          <button data-c="hr">구분선</button>
          <button data-c="footnote">각주</button>
          <button data-c="table" class="phone-only">표 넣기</button>
          <button data-c="date">오늘 날짜 넣기</button>
          <button data-c="fromSel">선택한 글로 새 노트</button>
          <div class="fsep"></div>
          <button data-c="callout-note"><i class="cdot note"></i>콜아웃 · 메모</button>
          <button data-c="callout-tip"><i class="cdot tip"></i>콜아웃 · 팁</button>
          <button data-c="callout-important"><i class="cdot important"></i>콜아웃 · 중요</button>
          <button data-c="callout-warning"><i class="cdot warning"></i>콜아웃 · 경고</button>
          <button data-c="callout-caution"><i class="cdot caution"></i>콜아웃 · 주의</button>
          <div class="fsep"></div>
          <button data-c="template">템플릿</button>
          <button data-c="find" title="⌘F">찾기·바꾸기</button>
        </div>
      </div>
    </div>
    <div class="ed-scroll" id="edScroll">
      <div class="doc">
        <input class="title" id="title" placeholder="제목" autocomplete="off" spellcheck="false">
        <div class="meta" id="meta"></div>
        <div id="editor"></div>
        <article class="reader" id="reader" hidden></article>
      </div>
    </div>
    <div class="main-empty" id="mainEmpty">
      <img class="empty-logo" src="logo-light.png" alt="music ITs">
      <div class="row">
        <button class="btn primary" id="eNew">새 노트<kbd data-k="alt+N"></kbd></button>
        <button class="btn" id="eToday">오늘 일기<kbd data-k="alt+D"></kbd></button>
        <button class="btn" id="eOpen">빠른 열기<kbd data-k="mod+O"></kbd></button>
      </div>
      <div class="empty-ct" id="emptyCt"></div>
    </div>
    <input type="file" id="fileIn" accept="image/*,application/pdf" multiple hidden>
  </main>

  <aside class="panel" id="panel" hidden>
    <div class="panel-h"><button class="gbtn phone-only" data-pane-go="main" aria-label="닫기"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button><span id="panelTitle">통계</span></div>
    <div class="panel-tabs">
      <button class="tab" data-tab="info" title="통계" aria-label="통계"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 19v-6M10 19V8M14 19v-9M18 19v-4"/></svg></button>
      <button class="tab" data-tab="outline" title="목차" aria-label="목차"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6.5h11M9 12h11M13 17.5h7"/><path d="M4.5 6.5h.5M4.5 12h.5M8.5 17.5h.5"/></svg></button>
      <button class="tab" data-tab="links" title="역방향 링크" aria-label="역방향 링크"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6L4.5 11.5 10 17M4.5 11.5H14a5.5 5.5 0 015.5 5.5v1"/></svg></button>
      <button class="tab" data-tab="history" title="기록" aria-label="기록"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 102.2-5.3L4.5 9"/><path d="M4.5 4.5V9H9M12 8v4.5l3 2"/></svg></button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</div>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script src="guest-data.js"></script>
<script src="guest.js"></script>
<script src="vendor/editor.js"></script>
<script src="app.js"></script>
</body>
</html>
